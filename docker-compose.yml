name: lume

services:
  db:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=lume
      - POSTGRES_PASSWORD=lume
      - POSTGRES_DB=lume
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lume"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    user: "1000:1000" # mesmo uid do host — evita __pycache__/.pytest_cache via bind mount como root
    volumes:
      - ./api:/app
    env_file:
      - ./api/.env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  docs:
    # No `user: "1000:1000"` here (unlike `api`) — matches the sibling
    # TruthID docs site's own compose file, which runs the frontend
    # container as root too. The named volume for node_modules below is
    # created root-owned by Docker; pinning to the host uid would break
    # `npm install` writing into it.
    build:
      context: ./docs
    volumes:
      - ./docs:/app
      - docs-node-modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - api
    command: sh -c "npm install && npm run dev -- -H 0.0.0.0"

volumes:
  db-data:
  docs-node-modules:
